<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba APK</title>
<style>
  body {
    margin: 0;
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
  }
  h1 {
    color: #f5b942;
    font-size: 28px;
    margin-bottom: 10px;
  }
  p {
    color: #888;
    font-size: 15px;
    margin-bottom: 30px;
  }
  button {
    background: transparent;
    color: #f5b942;
    border: 1px solid #f5b942;
    padding: 14px 28px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  button:active {
    background: #f5b942;
    color: #0a0a0a;
  }
</style>
</head>
<body>
  <h1>Prueba APK</h1>
  <p>Si esto funciona, el pipeline anda.</p>
  <button onclick="probar()">Tócame</button>
  <p id="resultado" style="margin-top:30px;color:#f5b942;"></p>

<script>
  function probar() {
    document.getElementById('resultado').textContent =
      'Funcionó. ' + new Date().toLocaleTimeString();
  }
</script>
</body>
</html>
